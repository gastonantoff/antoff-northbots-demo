<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Perfil del negocio</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            margin: 40px;
        }

        .contenedor {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,.15);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 5px;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background: #25D366;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>Configurar asistente</h1>

    <h2>{{ negocio[1] }}</h2>

    <form action="/perfil/{{ negocio[0] }}/guardar" method="post">

        <label>Descripción del negocio</label>
        <textarea name="descripcion">{{ perfil[2] if perfil else '' }}</textarea>

        <label>Productos o servicios</label>
        <textarea name="productos_servicios">{{ perfil[3] if perfil else '' }}</textarea>

        <label>Formas de pago</label>
        <textarea name="formas_pago">{{ perfil[4] if perfil else '' }}</textarea>

        <label>Entregas, envíos o reservas</label>
        <textarea name="entregas_reservas">{{ perfil[5] if perfil else '' }}</textarea>

        <label>Información adicional que debe conocer el asistente</label>
        <textarea name="informacion_adicional">{{ perfil[6] if perfil else '' }}</textarea>

        <button type="submit">Guardar perfil del asistente</button>

    </form>

</div>

</body>
</html>
