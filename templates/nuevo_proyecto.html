<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Proyecto</title>
</head>
<body>

    <h1>Nuevo Proyecto de Cliente</h1>
    <p>Creá un espacio independiente para el negocio. Su información, catálogo, asistente y canales quedarán separados de los demás clientes.</p>

    <form action="/proyectos/guardar" method="post">

        <p>
            <label>Nombre del proyecto</label><br>
            <input
                type="text"
                name="nombre"
                required
            >
        </p>

        <p>
            <label>Cliente</label><br>
            <input
                type="text"
                name="cliente"
                required
            >
        </p>

        <p>
            <label>Empresa</label><br>
            <input
                type="text"
                name="empresa"
                required
            >
        </p>

        <p>
            <label>Rubro</label><br>
            <input
                type="text"
                name="rubro"
                required
            >
        </p>

        <p>
            <label>Estado</label><br>
            <select name="estado">
                <option value="Nuevo">Nuevo</option>
                <option value="Recolección de datos">Recolección de datos</option>
                <option value="En desarrollo">En desarrollo</option>
                <option value="En pruebas">En pruebas</option>
                <option value="Listo para instalar">Listo para instalar</option>
                <option value="Instalado">Instalado</option>
                <option value="Pausado">Pausado</option>
            </select>
        </p>

        <p>
            <button type="submit">
                Crear Proyecto
            </button>
        </p>

    </form>

    <p>
        <a href="/proyectos">
            ← Volver
        </a>
    </p>

</body>
</html>
