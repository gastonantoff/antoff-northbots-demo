<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Editar Conocimiento</title>
</head>

<body>

<h1>✏️ Editar Conocimiento</h1>

<form method="post"
      action="/conocimiento/{{ conocimiento[0] }}/actualizar">

<p>

Categoría

<br>

<select name="categoria">

<option value="Información Institucional"
{% if conocimiento[2]=="Información Institucional" %}selected{% endif %}>
Información Institucional
</option>

<option value="Preguntas Frecuentes"
{% if conocimiento[2]=="Preguntas Frecuentes" %}selected{% endif %}>
Preguntas Frecuentes
</option>

<option value="Políticas"
{% if conocimiento[2]=="Políticas" %}selected{% endif %}>
Políticas
</option>

<option value="Procedimientos"
{% if conocimiento[2]=="Procedimientos" %}selected{% endif %}>
Procedimientos
</option>

<option value="Restricciones"
{% if conocimiento[2]=="Restricciones" %}selected{% endif %}>
Restricciones
</option>

<option value="Documentación"
{% if conocimiento[2]=="Documentación" %}selected{% endif %}>
Documentación
</option>

<option value="Observaciones"
{% if conocimiento[2]=="Observaciones" %}selected{% endif %}>
Observaciones
</option>

</select>

</p>

<p>

Título

<br>

<input
type="text"
name="titulo"
value="{{ conocimiento[3] }}"
style="width:500px">

</p>

<p>

Contenido

<br>

<textarea
name="contenido"
rows="10"
cols="80">{{ conocimiento[4] }}</textarea>

</p>

<p>

Observaciones

<br>

<textarea
name="observaciones"
rows="4"
cols="80">{{ conocimiento[5] }}</textarea>

</p>

<button type="submit">

Guardar cambios

</button>

</form>

</body>

</html>
