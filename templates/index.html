<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <title>Constructor de Bots</title>

    <style>

        body{
            font-family: Arial;
            background:#f5f5f5;
            margin:40px;
        }

        .contenedor{
            background:white;
            width:600px;
            margin:auto;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,.15);
        }

        h1{
            text-align:center;
        }

        label{
            font-weight:bold;
        }

        input,select{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:6px;
        }

        button{
            width:100%;
            padding:15px;
            background:#25D366;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#1ea952;
        }

    </style>

</head>

<body>

<div class="contenedor">

<h1>Constructor de Bots WhatsApp</h1>

<form action="/guardar" method="post">

<label>Nombre del negocio</label>
<input type="text" name="nombre">

<label>Rubro</label>
<input type="text" name="rubro">

<label>WhatsApp</label>
<input type="text" name="whatsapp">

<label>Horario</label>
<input type="text" name="horario">

<label>Dirección</label>
<input type="text" name="direccion">

<button type="submit">
Crear Bot
</button>

</form>

</div>

</div>

</body>

</html>
