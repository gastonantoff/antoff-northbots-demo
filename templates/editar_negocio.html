<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar negocio</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            margin: 40px;
        }

        .contenedor {
            background: white;
            width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,.15);
        }

        h1 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #25D366;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>Editar negocio</h1>

    <form action="/actualizar/{{ negocio[0] }}" method="post">

        <label>Nombre del negocio</label>
        <input type="text" name="nombre" value="{{ negocio[1] }}" required>

        <label>Rubro</label>
        <input type="text" name="rubro" value="{{ negocio[2] }}" required>

        <label>WhatsApp</label>
        <input type="text" name="whatsapp" value="{{ negocio[3] }}" required>

        <label>Horario</label>
        <input type="text" name="horario" value="{{ negocio[4] }}" required>

        <label>Dirección</label>
        <input type="text" name="direccion" value="{{ negocio[5] }}" required>

        <button type="submit">Guardar cambios</button>

    </form>

</div>

</body>
</html>
