<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Negocios creados</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            margin: 40px;
        }

        .contenedor {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,.15);
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #25D366;
            color: white;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>Negocios creados</h1>

    <a href="/">Crear nuevo negocio</a>

    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Rubro</th>
                <th>WhatsApp</th>
                <th>Horario</th>
                <th>Dirección</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            {% for negocio in negocios %}
            <tr>
                <td>{{ negocio[1] }}</td>
                <td>{{ negocio[2] }}</td>
                <td>{{ negocio[3] }}</td>
                <td>{{ negocio[4] }}</td>
                <td>{{ negocio[5] }}</td>
                <td>
    <a href="/perfil/{{ negocio[0] }}">Configurar asistente</a>
    
    <a href="/editar/{{ negocio[0] }}">Editar</a>

    <a href="/productos/{{ negocio[0] }}">Productos y servicios</a>

    <a href="/eliminar/{{ negocio[0] }}"
       onclick="return confirm('¿Seguro que querés eliminar este negocio?')">
        Eliminar
    </a>
</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

</body>
</html>
