<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ titulo_demo }}</title>
  <style>
    :root {
      --cyan: #16d9ef;
      --blue: #0b9fdd;
      --dark: #071018;
      --panel: #0e1a24;
      --text: #edfaff;
      --muted: #9fb7c3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #123647, #03070a 68%);
    }

    .chat {
      width: min(760px, 100%);
      height: min(760px, calc(100vh - 48px));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(22, 217, 239, .45);
      border-radius: 22px;
      background: rgba(7, 16, 24, .95);
      box-shadow: 0 20px 70px rgba(0, 0, 0, .5);
    }

    header {
      padding: 22px 24px;
      border-bottom: 1px solid rgba(22, 217, 239, .24);
      background: linear-gradient(90deg, #0a1f2b, #0b1219);
    }

    h1 {
      margin: 0;
      color: var(--cyan);
      font-size: 1.2rem;
    }

    header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: .9rem;
    }

    #mensajes {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .mensaje {
      width: fit-content;
      max-width: 82%;
      margin: 0 0 14px;
      padding: 13px 16px;
      border-radius: 16px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .asistente {
      background: var(--panel);
      border: 1px solid rgba(22, 217, 239, .25);
      border-bottom-left-radius: 4px;
    }

    .usuario {
      margin-left: auto;
      color: #001014;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      border-bottom-right-radius: 4px;
    }

    form {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid rgba(22, 217, 239, .24);
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 14px;
      color: var(--text);
      border: 1px solid #294552;
      border-radius: 12px;
      outline: none;
      background: #09131b;
      font-size: 1rem;
    }

    input:focus {
      border-color: var(--cyan);
    }

    button {
      padding: 0 20px;
      cursor: pointer;
      color: #001014;
      border: 0;
      border-radius: 12px;
      background: var(--cyan);
      font-weight: bold;
    }

    button:disabled {
      cursor: wait;
      opacity: .6;
    }
  </style>
</head>
<body>
  <main class="chat">
    <header>
      <h1>{{ titulo_demo }}</h1>
      <p>{{ subtitulo_demo }}</p>
    </header>

    <section id="mensajes" aria-live="polite">
      <div class="mensaje asistente">
        {{ saludo_demo }}
      </div>
    </section>

    <form id="formulario">
      <input
        id="mensaje"
        type="text"
        placeholder="Escribí tu consulta..."
        autocomplete="off"
        required
      >
      <button id="enviar" type="submit">Enviar</button>
    </form>
  </main>

  <script>
    const mensajes = document.getElementById("mensajes");
    const formulario = document.getElementById("formulario");
    const entrada = document.getElementById("mensaje");
    const boton = document.getElementById("enviar");

    const conversacionId =
      localStorage.getItem("{{ clave_conversacion }}") ||
      (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString());

    localStorage.setItem(
      "{{ clave_conversacion }}",
      conversacionId
    );

    function agregarMensaje(texto, tipo) {
      const elemento = document.createElement("div");
      elemento.className = `mensaje ${tipo}`;
      elemento.textContent = texto;
      mensajes.appendChild(elemento);
      mensajes.scrollTop = mensajes.scrollHeight;
      return elemento;
    }

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();

      const texto = entrada.value.trim();

      if (!texto) return;

      agregarMensaje(texto, "usuario");
      entrada.value = "";
      entrada.disabled = true;
      boton.disabled = true;

      const espera = agregarMensaje(
        "Pensando una respuesta...",
        "asistente"
      );

      try {
        const respuesta = await fetch("{{ endpoint_chat }}", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            conversacion_id: conversacionId,
            mensaje: texto
          })
        });

        const datos = await respuesta.json();

        espera.remove();

        if (!respuesta.ok) {
          throw new Error("No se pudo obtener una respuesta.");
        }

        agregarMensaje(
          datos.respuesta ||
          "No pude generar una respuesta ahora.",
          "asistente"
        );
      } catch (error) {
        espera.remove();
        agregarMensaje(
          "Ocurrió un problema local. Intentá nuevamente.",
          "asistente"
        );
      } finally {
        entrada.disabled = false;
        boton.disabled = false;
        entrada.focus();
      }
    });
  </script>
</body>
</html>
