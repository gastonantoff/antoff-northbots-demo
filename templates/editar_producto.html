<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto</title>
</head>
<body>

<h1>Editar producto</h1>

<form action="/productos/{{ negocio[0] }}/actualizar/{{ producto[0] }}" method="post">

    <p>Nombre</p>
    <input type="text" name="nombre" value="{{ producto[2] }}" required>

    <p>Descripción</p>
    <textarea name="descripcion">{{ producto[3] }}</textarea>

    <p>Precio</p>
    <input type="number" step="0.01" name="precio" value="{{ producto[4] }}">

    <p>Tipo</p>
    <select name="tipo">
        <option value="Producto"
            {% if producto[5] == "Producto" %}selected{% endif %}>
            Producto
        </option>

        <option value="Servicio"
            {% if producto[5] == "Servicio" %}selected{% endif %}>
            Servicio
        </option>
    </select>

    <br><br>

    <button type="submit">Guardar cambios</button>

</form>

</body>
</html>
